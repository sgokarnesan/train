version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword
      POSTGRES_DB: usersdb
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  user-service:
    build:
      context: .
      dockerfile: ./user-service/Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: usersdb
      DB_USER: appuser
      DB_PASSWORD: apppassword
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/usersdb
    depends_on:
      - postgres
    ports:
      - "8081:8081"

  order-service:
    build:
      context: .
      dockerfile: ./order-service/Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ordersdb
      DB_USER: appuser
      DB_PASSWORD: apppassword
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ordersdb
    depends_on:
      - postgres
    ports:
      - "8082:8082"

volumes:
  postgres-data:

